<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de evaluación de calificaciones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 40px;
        }
        .contenedor {
            background-color: white;
            padding: 20px;
            max-width: 400px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Sistema de evaluación de calificaciones</h2>

        <label>Nombre del estudiante:</label>
        <input type="text" id="nombre" placeholder="Escribe el nombre">

        <label>Primera calificación:</label>
        <input type="number" id="cal1" placeholder="0 a 10" step="0.1">

        <label>Segunda calificación:</label>
        <input type="number" id="cal2" placeholder="0 a 10" step="0.1">

        <label>Tercera calificación:</label>
        <input type="number" id="cal3" placeholder="0 a 10" step="0.1">

        <button onclick="calcularPromedio()">Calcular promedio</button>


        <div id="resultado"></div>
    </div>


    <script src="calificaciones.js"></script>
</body>
</html>
