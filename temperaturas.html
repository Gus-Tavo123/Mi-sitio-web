<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conversor de Temperaturas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
    }
    .contenedor {
      width: 300px;
      padding: 20px;
      border: 1px solid #ccc;
    }
    input, select, button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>Conversor de temperaturas</h1>

    <label for="temperatura">Ingresa la temperatura:</label>
    <input type="number" id="temperatura">

    <label for="opcion">Tipo de conversión:</label>
    <select id="opcion">
      <option value="c-f">Celsius a Fahrenheit</option>
      <option value="f-c">Fahrenheit a Celsius</option>
    </select>


    <button onclick="convertir()">Convertir</button>

    <p>Resultado:</p>
    <div id="resultado">Esperando valor...</div>
  </div>

 
  <script src="temperaturas.js"></script>

</body>
</html>
